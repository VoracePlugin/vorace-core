# ============================================================
#  Vorace - plugin libre de packs de ressources
#  Étape 1 : fusion des packs, hébergement et envoi aux joueurs
#  Après une modification : /vorace reload
# ============================================================

pack:
  # Texte affiché dans la liste des packs du joueur.
  description: "Pack du serveur"

  # Packs à fusionner, du MOINS prioritaire au PLUS prioritaire (le dernier gagne en cas de conflit).
  # Chemins relatifs au dossier du serveur. "/*" = chaque dossier ou .zip contenu, par ordre alphabétique.
  # Un chemin qui n'existe pas est simplement ignoré (voir /vorace sources).
  sources:
    - "plugins/ModelEngine/resource pack"
    - "plugins/MythicMobs/Generation/resource_pack"
    - "plugins/MythicMobs/Generation/resource_pack.zip"
    - "plugins/Vorace/pack/sources/*"

  # Fichiers à ne pas mettre dans le pack (en plus de .DS_Store, Thumbs.db, *.psd, *.bbmodel...).
  ignorer: []

  # Compacte les fichiers JSON (pack plus léger, rien ne change en jeu).
  compacter-json: true

  # "auto" = détecté depuis la version du serveur. Sinon un numéro, par exemple 46 ou 75.0
  format: auto

  # Image du pack (fichier dans plugins/Vorace/). Vide = celle du pack source le plus prioritaire.
  icone: ""

envoi:
  # Envoyer le pack aux joueurs quand ils arrivent.
  actif: true
  # Attente après l'arrivée avant l'envoi (20 ticks = 1 seconde).
  delai-ticks: 20
  # Le joueur ne peut pas jouer sans le pack (bouton "Refuser" = déconnexion côté jeu).
  obligatoire: true
  # Si le pack n'est pas obligatoire : expulser quand même ceux qui le refusent.
  expulser-si-refus: false
  # Après une reconstruction (reload ou changement d'un pack source), renvoyer le nouveau pack
  # à tous les joueurs connectés. Sinon il faut faire /vorace envoyer tous.
  renvoyer-apres-modification: false

hebergement:
  # auto      = sur le port du jeu (rien à ouvrir chez l'hébergeur), sinon sur le port dédié
  # meme-port = uniquement sur le port du jeu
  # port      = petit serveur web sur "port-dedie" (l'hébergeur doit ouvrir ce port)
  # externe   = tu mets toi-même plugins/Vorace/pack/genere/pack.zip en ligne, voir url-externe
  mode: auto
  # Adresse donnée aux joueurs pour télécharger. Vide = l'adresse qu'ils ont tapée pour se connecter.
  adresse-publique: ""
  # Port donné aux joueurs. 0 = celui qu'ils ont utilisé pour se connecter (ou le port dédié).
  port-public: 0
  port-dedie: 8163
  # Pour le mode externe. {sha1} est remplacé par l'empreinte du pack.
  url-externe: ""

objets:
  # Les objets sont décrits dans plugins/Vorace/objets/*.yml (voir exemple.yml).
  # Quand tu modifies un objet, ceux déjà dans les inventaires sont mis à jour à la connexion.
  mise-a-jour-auto: true

blocs:
  # Les blocs personnalisés sont des blocs à note. Paper peut les empêcher de changer d'instrument quand
  # un bloc voisin change (block-updates.disable-noteblock-updates dans config/paper-global.yml).
  # Si true, Vorace active ce réglage tout seul la première fois (redémarrage nécessaire une fois).
  # Sans ce réglage, Vorace corrige les blocs lui-même, mais un bloc peut clignoter.
  reglage-paper-auto: true

glyphes:
  # Remplace les raccourcis d'emojis (:coeur:, <3...) dans le chat et sur les panneaux.
  # Les glyphes se créent dans plugins/Vorace/glyphes/ (voir exemple-glyphes.yml).
  chat: true
  panneaux: true

menus:
  # Menus de /vorace : fond dessiné aux couleurs de Vorace (dans le pack de ressources).
  # false = coffres normaux du jeu, avec des vitres violettes et roses.
  fond-dessine: true

modeles:
  # Modèles animés (plugins/Vorace/modeles-animes/*.bbmodel) : nombre de tics entre deux images de l'animation.
  # 1 = le plus fluide, 2 = deux fois moins de données envoyées aux joueurs (le jeu adoucit entre les images).
  intervalle-tics: 2
  # Les parties d'un modèle n'existent que si un joueur est à moins de tant de blocs (0 = toujours).
  # Au-delà de la moitié de cette distance, les images sont envoyées deux fois moins souvent.
  distance-affichage: 48
  # Durée du fondu entre deux animations (repos -> marche, entrée et sortie de « degat »...). 0 = coupure nette.
  fondu-secondes: 0.2
  # Les os de tête (« h_... », « head », « tete ») suivent le regard du mob.
  suivi-tete: true
  # Le modèle rougit un instant quand son mob est touché (1.21.4 et plus).
  teinte-degats: true
  # Sons et particules des clés « Effets » des animations de Blockbench.
  effets: true

pantin:
  # Pantin des joueurs : pendant une animation de compétence ou une emote, le joueur est caché et remplacé par un
  # modèle animé (modeles-animes/joueur.bbmodel) qui porte son vrai skin, sans mod.
  actif: true
  # Le skin est lu sur les serveurs de Mojang (gardé ensuite dans peaux/) et dessiné pixel par pixel par des modèles du
  # pack : plus besoin de MineSkin. Les anciennes clés mineskin-cle, mineskin-adresse et delai-ms ne servent plus.
  preparer-a-la-connexion: true
  # Le vrai joueur disparaît pour les autres pendant l'animation (corps invisible, équipement caché).
  cacher-joueur: true
  # Les morceaux du pantin sont des passagers du joueur : le corps suit le joueur sans aucun retard (y compris pour
  # lui-même à la première personne). Avec monter-par-paquets (défaut), ils ne sont passagers que chez les clients et les
  # téléportations marchent ; sinon, un plugin qui téléporte doit d'abord appeler VoraceAPI.arreterJoueur. false : ancien
  # suivi (le corps suit avec un léger retard).
  monter-sur-le-joueur: true
  # Le joueur voit son propre pantin depuis ses yeux, tête comprise (le jeu n'en dessine pas l'intérieur). Sa copie est
  # reculée de ce nombre de pixels (comme le mod « First Person Model ») : il voit ses bras et ses poings partir devant
  # lui sans avoir les épaules dans la caméra. Les autres voient le pantin à sa vraie place. 0 : pas de recul.
  recul-pour-soi: 4
  # Taille du pantin des joueurs. Le jeu dessine ses joueurs à 0,9375 (1,875 bloc de haut) : à 1, le pantin fait 2 blocs et
  # son crâne entre dans le plafond d'un couloir de 2 blocs.
  taille: 0.9375
  # La tête tourne d'abord, le corps suit (comme dans le jeu) : part de l'écart au regard que le corps rattrape à chaque tic
  # (0.3 : rejoint en un quart de seconde ; 1 : corps toujours face au regard, sans retard) et écart maximal entre la tête
  # et le corps, en degrés. Pendant une compétence, le corps est face au regard tout de suite.
  corps-suit-regard: 0.3
  tete-max: 50
  # Ultimes : le joueur voit la scène comme un film (caméra qui tourne autour de lui, recule pour montrer le phénix, le
  # titan ou la météorite), puis retrouve sa place et sa vue. Mode spectateur rattaché à une caméra invisible pendant
  # ces quelques secondes, comme les plugins de cinématiques ; seulement pour les animations qui ont un os « camera ».
  camera-ultimes: true
  # « spectateur » : caméra fluide, sans barre d'objets ni interface (cinématique). « monture » : le joueur monte sur
  # un support invisible et garde sa barre d'objets, mais la caméra est moins fluide.
  camera-mode: spectateur
  # Corps fantôme : pendant que le pantin le remplace, le vrai joueur est invisible seulement dans les paquets (le serveur
  # et les monstres le voient toujours). Chez lui, il est mis dans une équipe à lui (« voir les alliés invisibles ») et le
  # shader du pack le dessine opaque dans les menus (son personnage dans l'inventaire, armure comprise) et l'efface dans le
  # monde (F5 : il voit son pantin). Avec un pack de shaders Iris ou OptiFine actif, le shader du pack est ignoré : le
  # fantôme reste semi-transparent. Les dessins d'armure portée du pack sont marqués (opacité 253) pour n'être dessinés sur
  # le vrai joueur que dans les menus.
  fantome:
    actif: true
    # false : chez lui, le joueur est totalement invisible (plus de fantôme, ni dans l'inventaire ni en F5)
    equipe-soi: true
    # shaders du corps fantôme et des armures ajoutés au pack
    shader: true
    # Avec le pantin permanent seulement : l'armure reste envoyée au joueur (visible sur son personnage dans l'inventaire) et
    # le shader des armures du pack l'efface dans le monde, où son pantin porte la sienne. Sans pantin permanent, le pack ne
    # touche pas aux armures (les joueurs sont dessinés par le jeu). Après /vorace pantin permanent on|off : /vorace reload
    # puis /vorace envoyer tous, pour que le pack suive.
    armure-inventaire: true
    # aucune armure portée dessinée dans le monde (armures du jeu comprises, dont les dessins ne sont pas dans le pack et ne
    # peuvent pas être marqués) : le vrai joueur n'en porte plus en F5, le pantin porte la sienne. Effet de bord : les
    # porte-armures et les monstres du jeu n'en montrent plus. false : seulement les armures du pack.
    cacher-toutes-armures: true
  # Morceaux du pantin montés sur le joueur seulement chez les clients (le serveur ne voit aucun passager) : le corps suit
  # le joueur sans retard ET les téléportations des plugins marchent (Paper refuse de téléporter un joueur qui porte de
  # vrais passagers). false : vrais passagers (il faut alors arrêter le pantin avant de téléporter le joueur).
  monter-par-paquets: true
  # Pantin permanent : le joueur est remplacé tout le temps par son pantin (pas seulement pendant une compétence). Le
  # pantin joue de lui-même le repos, la marche, la course, le recul, les pas de côté, l'accroupi, le saut, la chute, la
  # nage, l'échelle, assis, couché ; les gestes par-dessus (coup de bras, manger, viser à l'arc, bouclier...) et un
  # sursaut aux coups reçus. Ces mouvements viennent de modeles-animes/pantin_mouvements.bbmodel (à retoucher dans
  # Blockbench) et sont prêtés à tout modèle au même squelette (les modèles des classes) par le nom des os ; un modèle qui
  # a sa propre « marche » garde la sienne. Les compétences se jouent sur le même pantin, qui revient ensuite à ses
  # mouvements. Retiré en spectateur, sous une vraie potion d'invisibilité et à la mort ; remis tout seul ensuite.
  permanent:
    actif: false
    # modèle des mouvements prêtés
    mouvements: pantin_mouvements
    # Au-delà de cette distance (blocs), un joueur voit le joueur du jeu (sans animations) à la place du pantin, pour
    # économiser le réseau. 0 : jamais, le pantin est vu aussi loin que le jeu montre le joueur (ses images sont alors
    # envoyées moins souvent quand personne n'est près : 1 tic sur 2 au-delà de 16 blocs, 1 sur 3 au-delà de 32, 1 sur 4
    # au-delà de 64 ; le jeu adoucit entre deux). Avec cacher-toutes-armures, le joueur du jeu vu de loin n'a pas d'armure.
    distance: 0
    # Qui tient l'objet à la première personne (essai en jeu : /vorace pantin vue pantin|main-du-jeu) :
    #   pantin       comme le mod First-person Model : le pantin tient l'objet dans ses mains, à la première personne comme
    #                en F5 ; la main du jeu est cachée (l'objet garde son icône dans la barre). Le joueur voit ses bras et
    #                son arme bouger avec ses animations.
    #   main-du-jeu  la main du jeu tient l'objet à la première personne ; les bras de son pantin sont effacés près de la
    #                caméra (shader du pack) et son pantin ne tient rien hors compétence, même en F5.
    premiere-personne: pantin
  # Essai : la copie que le joueur voit de lui-même tourne avec sa caméra à chaque image (affichages « billboard »), sans
  # attendre le serveur : plus de retard du corps quand il tourne vite à la première personne. Limite : en vue F5 de face,
  # la caméra est retournée et la copie aussi. Le décalage (degrés) corrige l'orientation si elle est fausse en jeu.
  soi-tourne-avec-la-camera: false
  soi-tourne-avec-la-camera-decalage: 0
  # Armures en volume sur le pantin : modèle d'équipement de la pièce (composant equippable, « babel:fer ») → .bbmodel de
  # modeles-animes. Ce .bbmodel est une copie du squelette du joueur (mêmes noms d'os, mêmes pivots) dont les os sont rangés
  # dans des groupes « casque », « plastron », « jambieres », « bottes » ; les cubes de chaque os sont posés sur l'os du
  # pantin de même nom (« peau_bras_droit_haut »...). Exemple :  babel:fer: armure_fer
  armures-3d: {}
  # garder aussi la couche plate du jeu sous la pièce en volume
  armures-3d-plat: true
  # Fin d'une animation : le pantin garde sa dernière pose ce temps-là (le coup suivant d'un combo reprend le même
  # pantin), puis revient en douceur à la pose que le jeu donne au vrai joueur (corps tourné comme le sien, bras le long
  # du corps ou levé s'il tient un objet) avant l'échange : plus de saut vers le skin de base. 0 : échange immédiat.
  pause-fin-secondes: 0.1
  retour-secondes: 0.25
  # Objets tenus (arme, bouclier, arme de poing par paire) dans les mains du pantin, placés comme le jeu les tient.
  objets-en-main: true
  # Pendant l'animation, chez le joueur lui-même : plus d'armure sur son corps invisible (F5) ni d'objets en main (ils
  # sont dans les mains de sa copie du pantin). Les icônes de l'inventaire restent ; l'inventaire du serveur n'est
  # jamais touché (copies changées dans les paquets, couche paquets de Vorace). Objets de vorace-item seulement pour
  # les mains (drapeau 0 de custom_model_data).
  cacher-objets-soi: true
  # Arme par paire (armes de poing de vorace-item) sans rien dans l'autre main : montrée aussi dans la main gauche, à la
  # troisième personne (F5, autres joueurs) ; à la première personne, comme le jeu.
  paires: true
  # Au joueur lui-même aussi (deux armes en F5). La case de la main gauche à côté de la barre d'objets devient alors
  # transparente dans le pack (cacher-case-main-gauche) ; un objet vraiment tenu en main gauche garde son icône.
  paires-soi: true
  cacher-case-main-gauche: true
  # Armure portée dessinée sur le pantin (casque, plastron, jambières, bottes) avec les textures d'équipement du jeu,
  # teinte du cuir et éclat des enchantements compris. Les ornements (trims) ne sont pas dessinés.
  armure: true
  # Armures d'un pack de ressources (modèle d'équipement « espace:nom », textures dans
  # assets/<espace>/textures/entity/equipment/humanoid/<nom>.png et humanoid_leggings/<nom>.png).
  armures-perso: []

surveillance:
  # Reconstruit le pack tout seul quand un pack source ou un objet change (par exemple après /meg reload).
  actif: true
  intervalle-secondes: 5

messages:
  prefixe: "<gradient:#7b2ff7:#f107a3><bold>Vorace</bold></gradient> <dark_gray>»</dark_gray> "
  invite: "<gray>Ce serveur utilise un pack de ressources pour ses objets, menus et modèles 3D."
  refuse: "<yellow>Tu as refusé le pack : certains objets et menus s'afficheront mal. <gray>Tape <white>/vorace pack</white> pour le recevoir."
  echec: "<red>Le pack n'a pas pu être téléchargé. <gray>Tape <white>/vorace pack</white> pour réessayer."
  expulsion-refus: "<red>Le pack de ressources est obligatoire sur ce serveur.\n<gray>Accepte-le en te reconnectant (ou active-le dans Multijoueur > Modifier > Packs de ressources)."

# Affiche le détail de chaque fusion et de chaque envoi dans la console.
debug: false

paquets:
  # Couche paquets (rôle de ProtocolLib) pour les plugins qui utilisent l'API de Vorace et pour /vorace paquets.
  # Elle ne coûte rien tant que personne n'écoute. false = Vorace ne touche pas aux connexions.
  actif: true
