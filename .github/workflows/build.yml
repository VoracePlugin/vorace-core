name: Compilation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # le .jar publié est celui compilé contre 1.21.1 ; les autres vérifient que le code reste compatible
        paper: ["1.21.1-R0.1-SNAPSHOT", "1.21.4-R0.1-SNAPSHOT", "1.21.11-R0.1-SNAPSHOT", "26.2.build.+"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.0"
      - name: Compiler et tester
        run: gradle build tests -PpaperApi="${{ matrix.paper }}"
      - name: Publication comme JitPack (dépendance pour les autres plugins)
        if: matrix.paper == '1.21.1-R0.1-SNAPSHOT'
        run: |
          gradle publishToMavenLocal -Pjdk=21 -PpaperApi="${{ matrix.paper }}"
          ls -R ~/.m2/repository/com/github/VoracePlugin/vorace-core/
      - name: Garder le .jar
        if: matrix.paper == '1.21.1-R0.1-SNAPSHOT'
        uses: actions/upload-artifact@v4
        with:
          name: Vorace
          path: build/libs/Vorace-*.jar
      - name: Appels à l'API (pour comparer avec une compilation hors Gradle)
        if: matrix.paper == '1.21.1-R0.1-SNAPSHOT'
        run: |
          mkdir -p build/javap && cd build/javap && unzip -q -o ../libs/Vorace-*.jar 'fr/*'
          find fr -name '*.class' | sort | xargs javap -c -p | grep -oE '(invoke[a-z]+|[gp]et(static|field)|checkcast|instanceof|new) +#[0-9]+(, *[0-9]+)? +// .*(org/bukkit|io/papermc|net/kyori|io/netty|com/google|net/md_5|org/joml)[^ ]*' | sed -E 's/#[0-9]+(, *[0-9]+)? +\/\/ //' | sort -u > ../appels-api.txt
          echo "APPELS $(wc -l < ../appels-api.txt) $(sha256sum ../appels-api.txt | cut -c1-16)"
          cat ../appels-api.txt

  # essai sur un vrai serveur Paper : le golem d'exemple doit s'animer (vu par un faux joueur)
  essai-serveur:
    needs: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: "1.21.4"
            client: ""
          - paper: "1.21.4"
            client: "26.1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: Vorace
          path: jar
      - name: Faux joueur
        run: cd outils && npm init -y > /dev/null && npm install --no-audit --no-fund mineflayer
      - name: Essai des modèles animés
        run: outils/essai-serveur.sh "${{ matrix.paper }}" jar "${{ matrix.client }}"
